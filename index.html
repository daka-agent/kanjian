<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>看见 — 一款关于「注意到」的互动叙事游戏</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁</text></svg>">
</head>
<body>

  <!-- 标题页 -->
  <div id="title" class="screen active">
    <div id="title-content"></div>
  </div>

  <!-- 工作台 -->
  <div id="dashboard" class="screen">
    <div id="dashboard-content"></div>
  </div>

  <!-- 信号详情 -->
  <div id="signal" class="screen">
    <div id="signal-content"></div>
  </div>

  <!-- 响应展示 -->
  <div id="response" class="screen">
    <div id="response-content"></div>
  </div>

  <!-- 内心独白 -->
  <div id="thought" class="screen">
    <div id="thought-content"></div>
  </div>

  <!-- 日终总结 -->
  <div id="daySummary" class="screen">
    <div id="summary-content"></div>
  </div>

  <!-- 结局 -->
  <div id="ending" class="screen">
    <div id="ending-content"></div>
  </div>

  <!-- 结局画廊 -->
  <div id="gallery" class="screen">
    <div id="gallery-content"></div>
  </div>

  <!-- 公益资源 -->
  <div id="resources" class="screen">
    <div id="resources-content"></div>
  </div>

  <!-- 新手引导 -->
  <div id="tutorial" class="screen">
    <div id="tutorial-content"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
